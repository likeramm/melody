# 로컬 개발용 PostgreSQL. 운영 환경에서는 Neon/Supabase 등 관리형 DB 를 사용하세요.
services:
  db:
    image: postgres:17-alpine
    container_name: melody-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: melody
      POSTGRES_PASSWORD: melody
      POSTGRES_DB: melody_hq
    ports:
      - "5432:5432"
    volumes:
      - melody-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melody -d melody_hq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  melody-db-data:
